<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Expedición Micro · Isla Fotosíntesis e Isla Respiración</title>
<style>
@font-face{font-family:'Fredoka';src:url(data:font/woff2;base64,__FREDOKA__) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Nunito';src:url(data:font/woff2;base64,__NUNITO__) format('woff2');font-weight:200 1000;font-display:swap}
:root{--crema:#FFF8EC;--crema2:#FDEFD6;--hoja:#2E9E5B;--hojaO:#1F6B44;--sol:#FFC43D;--terra:#E0704A;--terraO:#B4492A;--mar:#3FB6C6;--marO:#1D6B85;--tinta:#22313B;--gris:#6B7A85;--sombra:0 10px 30px rgba(20,50,60,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--crema);color:var(--tinta);font-family:'Nunito',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.fr{font-family:'Fredoka','Nunito',sans-serif;font-weight:600}
button{font-family:'Fredoka','Nunito',sans-serif;cursor:pointer;border:none}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:block}
/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 30px;border-radius:16px;font-size:22px;font-weight:600;color:#fff;background:linear-gradient(180deg,#3DBA6E,#23874C);box-shadow:0 5px 0 #16613A,0 10px 20px rgba(22,97,58,.25);transition:transform .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #16613A}
.btn.terra{background:linear-gradient(180deg,#F08A5D,#D45B36);box-shadow:0 5px 0 #9C3E22,0 10px 20px rgba(156,62,34,.25)}
.btn.mar{background:linear-gradient(180deg,#4FC3D3,#2390A6);box-shadow:0 5px 0 #17697A,0 10px 20px rgba(23,105,122,.25)}
.btn.claro{background:#fff;color:var(--tinta);box-shadow:0 5px 0 #D9CDB8,0 10px 20px rgba(0,0,0,.08)}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.btn svg{width:26px;height:26px}
/* ---------- inicio ---------- */
#inicio{background:linear-gradient(180deg,#BFE9F0 0%,#E6F7F4 45%,#FFF3DC 100%)}
#inicio canvas.fondo{position:absolute;inset:0;width:100%;height:100%}
.ini-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1500px,95vw);height:min(820px,92vh);display:grid;grid-template-columns:1fr 1.15fr;gap:0;background:rgba(255,252,245,.93);border-radius:34px;box-shadow:var(--sombra);overflow:hidden;backdrop-filter:blur(4px)}
.ini-izq{padding:3.2vh 3vw;display:flex;flex-direction:column;gap:2vh;overflow:auto}
.marca{display:flex;align-items:center;gap:16px}
.marca svg{width:74px;height:74px;flex:none}
.marca h1{font-size:clamp(34px,3.4vw,58px);line-height:.95;color:var(--hojaO)}
.marca h1 span{color:var(--terra)}
.marca p{font-family:'Fredoka';font-size:clamp(15px,1.15vw,20px);color:var(--gris);margin-top:6px;font-weight:500}
.ini-intro{font-size:clamp(15px,1.1vw,19px);line-height:1.45;background:#EEF8F1;border-left:6px solid var(--hoja);padding:12px 16px;border-radius:12px}
.campo label{display:block;font-family:'Fredoka';font-weight:600;font-size:17px;margin-bottom:6px;color:var(--hojaO)}
.campo input{width:100%;font:700 20px 'Nunito';padding:12px 16px;border-radius:14px;border:3px solid #E3D7C2;background:#fff;color:var(--tinta);outline:none;-webkit-user-select:text;user-select:text}
.campo input:focus{border-color:var(--hoja)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.secc{display:flex;gap:12px}
.secc button{flex:1;padding:12px;font-size:22px;border-radius:14px;background:#fff;border:3px solid #E3D7C2;color:var(--tinta);font-weight:600}
.secc button.sel{background:var(--hoja);border-color:var(--hojaO);color:#fff}
.ini-der{background:linear-gradient(160deg,#FFE7B8,#FFD9C2 50%,#D7F0E1);padding:3.2vh 2.4vw;display:flex;flex-direction:column;gap:1.6vh}
.ini-der h2{font-size:clamp(22px,1.8vw,32px);color:var(--terraO)}
.pjs{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;min-height:0}
.pj{position:relative;background:rgba(255,255,255,.7);border:4px solid transparent;border-radius:24px;cursor:pointer;display:flex;align-items:stretch;overflow:hidden;transition:transform .12s,border-color .12s}
.pj:hover{transform:translateY(-3px)}
.pj.sel{border-color:var(--hoja);background:#fff;box-shadow:0 8px 24px rgba(46,158,91,.3)}
.pj canvas{width:52%;height:100%}
.pj .pjtx{flex:1;padding:14px 14px 14px 0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.pj .pjtx b{font-family:'Fredoka';font-size:clamp(22px,1.9vw,34px);color:var(--tinta)}
.pj .pjtx span{font-size:clamp(13px,.95vw,16px);color:var(--gris);line-height:1.3}
.pj .tilde{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--hoja);display:none;align-items:center;justify-content:center}
.pj.sel .tilde{display:flex}
.ini-err{color:var(--terraO);font-weight:800;min-height:22px}
/* ---------- mapa ---------- */
#mapa svg.mapa{position:absolute;inset:0;width:100%;height:100%}
.barra{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:18px;padding:0 24px;background:linear-gradient(180deg,rgba(255,250,240,.96),rgba(255,250,240,.86));box-shadow:0 4px 18px rgba(0,0,0,.08);z-index:5}
.barra canvas{width:58px;height:58px;border-radius:50%;background:#FFE7B8;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.barra .quien b{font-family:'Fredoka';font-size:22px;display:block}
.barra .quien span{color:var(--gris);font-weight:700}
.barra .esp{flex:1}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:40px;padding:8px 18px;font-family:'Fredoka';font-size:21px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.chip svg{width:26px;height:26px}
.ibtn{width:52px;height:52px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #D9CDB8}
.ibtn svg{width:30px;height:30px}
.est{cursor:pointer}
.est .aro{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.est:hover .aro{transform:scale(1.12)}
.est.bloq{cursor:not-allowed}
.panel-est{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(1100px,92vw);background:rgba(255,252,245,.97);border-radius:26px;box-shadow:var(--sombra);padding:18px 26px;display:flex;gap:24px;align-items:center;z-index:6}
.panel-est .pe-ic{width:96px;height:96px;flex:none}
.panel-est h3{font-size:28px}
.panel-est p{font-size:18px;line-height:1.4;color:#3A4A55;margin-top:4px}
.panel-est .pe-tx{flex:1}
.estrellas{display:inline-flex;gap:3px;vertical-align:middle;margin-left:10px}
.estrellas svg{width:24px;height:24px}
/* ---------- juego ---------- */
#juego canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:10px 18px;pointer-events:none;z-index:4}
.hud > *{pointer-events:auto}
.hud .tit{background:rgba(255,252,245,.92);border-radius:18px;padding:8px 18px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.hud .tit small{display:block;font-weight:800;color:var(--gris);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.hud .tit b{font-family:'Fredoka';font-size:22px}
.corazones{display:flex;gap:4px;background:rgba(255,252,245,.92);border-radius:18px;padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.corazones svg{width:30px;height:30px}
.hud .chip{box-shadow:0 3px 10px rgba(0,0,0,.12)}
.obj{background:rgba(255,252,245,.92);border-radius:18px;padding:8px 16px;box-shadow:0 3px 10px rgba(0,0,0,.12);font-weight:800;font-size:17px;max-width:34vw}
.obj small{display:block;font-weight:800;color:var(--gris);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ecu{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(255,252,245,.94);border-radius:22px;padding:8px 20px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:4;white-space:nowrap}
.ecu .t{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:14px;background:#F3EDE2;transition:background .3s}
.ecu .t.ok{background:#D8F1E0}
.ecu .t img{width:40px;height:40px}
.ecu .t .n{font-family:'Fredoka';font-size:20px;font-weight:600;min-width:38px}
.ecu .t .nm{font-size:13px;font-weight:800;line-height:1.05;color:#3A4A55}
.ecu .t .nm i{font-style:normal;display:block;font-family:'Fredoka';font-size:16px;color:var(--tinta)}
.ecu .mas{font-family:'Fredoka';font-size:26px;color:var(--gris)}
.ecu .fl{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:var(--hojaO);line-height:1.1}
.ecu .fl svg{width:88px;height:20px}
.ecu .t.energia{background:linear-gradient(90deg,#FFF1C2,#FFE08A)}
.toast{position:absolute;left:50%;top:86px;transform:translateX(-50%) translateY(-12px);opacity:0;transition:all .35s;background:#fff;border-radius:18px;padding:12px 20px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;max-width:min(860px,80vw);z-index:6;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast img{width:48px;height:48px;flex:none}
.tactil{position:absolute;inset:auto 0 0 0;height:0;z-index:5;display:none}
.tactil.on{display:block}
.tbtn{position:absolute;bottom:110px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;touch-action:none}
.tbtn svg{width:52px;height:52px}
.tbtn.act{background:rgba(255,226,140,.95)}
/* ---------- modales ---------- */
.velo{position:fixed;inset:0;background:rgba(30,60,70,.38);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(3px)}
.velo.on{display:flex}
.modal{width:min(1180px,94vw);max-height:92vh;overflow:auto;background:var(--crema);border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.modal .cab{padding:22px 34px;color:#fff;display:flex;align-items:center;gap:18px}
.modal .cab.f{background:linear-gradient(110deg,#2E9E5B,#7CC36A)}
.modal .cab.r{background:linear-gradient(110deg,#D45B36,#F2A65A)}
.modal .cab.n{background:linear-gradient(110deg,#2390A6,#5CC9C0)}
.modal .cab svg{width:64px;height:64px;flex:none}
.modal .cab small{font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.modal .cab h2{font-size:34px;line-height:1.05}
.modal .cuerpo{padding:24px 34px 28px;display:grid;gap:20px}
.dos{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start}
.modal p{font-size:19px;line-height:1.5}
.modal .lista{display:grid;gap:10px}
.modal .lista div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:17px}
.modal .lista img,.modal .lista svg{width:42px;height:42px;flex:none}
.nota{font-size:14px!important;color:var(--gris);background:#F3EDE2;border-radius:12px;padding:8px 12px;line-height:1.4!important}
.teclas{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:12px 16px}
.teclas svg{height:64px;width:auto;flex:none}
.teclas p{font-size:16px!important}
.pie{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap}
.preg{background:#fff;border-radius:20px;padding:20px 24px}
.preg h3{font-size:24px;margin-bottom:14px}
.ops{display:grid;gap:10px}
.ops button{text-align:left;font:700 19px 'Nunito';padding:14px 18px;border-radius:14px;background:#F6F1E8;border:3px solid transparent;color:var(--tinta);display:flex;gap:12px;align-items:center}
.ops button:hover:not(:disabled){border-color:#BFD9C8}
.ops button .le{font-family:'Fredoka';width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ops button.bien{background:#D8F1E0;border-color:var(--hoja)}
.ops button.mal{background:#FBE0D6;border-color:var(--terra)}
.expl{margin-top:12px;font-size:17px;font-weight:700;padding:12px 16px;border-radius:14px;display:none}
.expl.on{display:block}
.expl.bien{background:#E7F6EC;color:#1F6B44}
.expl.mal{background:#FDEDE6;color:#9C3E22}
.prog{display:flex;gap:8px;justify-content:center}
.prog i{width:14px;height:14px;border-radius:50%;background:#E3D7C2}
.prog i.on{background:var(--hoja)}
/* faro: armar ecuación */
.armado{background:#fff;border-radius:22px;padding:22px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.hueco{min-width:150px;height:96px;border:3px dashed #CDBFA6;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:#A99A80;font-size:15px;padding:6px 10px;text-align:center;transition:all .2s}
.hueco.lleno{border-style:solid;border-color:var(--hoja);background:#EAF7EF;color:var(--tinta)}
.hueco img{width:46px;height:46px}
.hueco.cond{min-width:170px;height:62px;font-size:14px}
.flechag{display:flex;flex-direction:column;align-items:center;gap:6px}
.flechag svg{width:150px;height:26px}
.fichas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ficha{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:16px;background:#fff;border:3px solid #E3D7C2;font:800 18px 'Nunito';color:var(--tinta)}
.ficha img{width:44px;height:44px}
.ficha:hover{border-color:var(--hoja)}
.ficha.usada{opacity:.3;pointer-events:none}
.ficha.sacude{animation:sac .4s}
@keyframes sac{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.res div{background:#fff;border-radius:18px;padding:16px;text-align:center}
.res b{display:block;font-family:'Fredoka';font-size:38px;color:var(--hojaO)}
.res span{font-weight:800;color:var(--gris)}
.estgr{display:flex;justify-content:center;gap:10px}
.estgr svg{width:70px;height:70px}
/* final */
#final{background:linear-gradient(160deg,#D7F0E1,#FFF3DC 50%,#FFD9C2)}
.cert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1500px,95vw);height:min(840px,93vh);background:#FFFDF8;border-radius:34px;box-shadow:var(--sombra);display:grid;grid-template-columns:420px 1fr;overflow:hidden}
.cert .cizq{background:linear-gradient(180deg,#FFE7B8,#FFD0B5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.cert .cizq canvas{width:300px;height:360px}
.cert .cizq b{font-family:'Fredoka';font-size:30px;text-align:center}
.cert .cder{padding:34px 40px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.cert h1{font-size:46px;color:var(--hojaO)}
.rango{display:inline-flex;align-items:center;gap:12px;background:var(--hoja);color:#fff;border-radius:40px;padding:8px 22px;font-family:'Fredoka';font-size:26px;align-self:flex-start}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.comp > div{border-radius:20px;padding:18px 20px}
.comp .cf{background:#E7F6EC}
.comp .cr{background:#FDEDE6}
.comp h3{font-size:24px;margin-bottom:8px}
.comp p{font-size:16px;line-height:1.45;margin:4px 0}
@media print{.velo,.pie,.noimp{display:none!important}.cert{box-shadow:none}}
@media (max-width:900px){.ini-card{grid-template-columns:1fr;overflow:auto}.dos{grid-template-columns:1fr}.cert{grid-template-columns:1fr}}
.cniv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cniv div{background:#fff;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:4px}.cniv div.f{border-left:6px solid #2E9E5B}.cniv div.r{border-left:6px solid #E0704A}.cniv svg{width:20px;height:20px}
</style>
</head>

</body>
</html>
